<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <!-- Stylized Monochromatic Mobile Store Mockup -->
  <g transform="translate(290, 60)">
    <!-- Device Frame -->
    <rect width="220" height="330" rx="28" fill="#181818" stroke="#333333" stroke-width="2"/>
    <rect x="75" y="10" width="70" height="14" rx="7" fill="#0d0d0d"/>
    
    <!-- App UI Mockup Elements -->
    <rect x="20" y="45" width="180" height="28" rx="8" fill="#222222"/>
    <rect x="32" y="55" width="60" height="8" rx="4" fill="#555555"/>
    
    <!-- Hero Product Card -->
    <rect x="20" y="85" width="180" height="110" rx="12" fill="#242424" stroke="#2e2e2e" stroke-width="1"/>
    <circle cx="110" cy="130" r="28" fill="#1a1a1a" stroke="#383838" stroke-width="1"/>
    <path d="M 103 125 L 117 125 L 110 138 Z" fill="#888888"/>
    <rect x="32" y="172" width="70" height="8" rx="4" fill="#a3a3a3"/>
    <rect x="32" y="184" width="40" height="6" rx="3" fill="#666666"/>
    
    <!-- Grid Mini Items -->
    <rect x="20" y="206" width="85" height="75" rx="8" fill="#202020"/>
    <rect x="115" y="206" width="85" height="75" rx="8" fill="#202020"/>

    <!-- Bottom Nav -->
    <line x1="20" y1="295" x2="200" y2="295" stroke="#292929" stroke-width="1"/>
    <circle cx="50" cy="308" r="6" fill="#f5f5f5"/>
    <circle cx="110" cy="308" r="6" fill="#444444"/>
    <circle cx="170" cy="308" r="6" fill="#444444"/>
  </g>

  <!-- Badge Text -->
  <rect x="32" y="32" width="190" height="34" rx="17" fill="#181818" stroke="#333333" stroke-width="1"/>
  <text x="127" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">E-COMMERCE FLOWS</text>

  <text x="150" y="225" font-family="'Inter', 'Cairo', sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Tahara</text>
  <text x="150" y="255" font-family="'Cairo', sans-serif" font-size="20" font-weight="600" fill="#737373" text-anchor="start">طهارة</text>
  <text x="150" y="290" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">Salla REST API • Cart State • Analytics</text>
</svg>
