<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  <rect width="800" height="450" fill="url(#gridPattern)" opacity="0.6"/>
  <!-- Decorative Radar / Route Geometry -->
  <circle cx="400" cy="225" r="160" fill="none" stroke="#262626" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="225" r="100" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="400" cy="225" r="40" fill="#181818" stroke="#555555" stroke-width="2"/>
  <circle cx="400" cy="225" r="8" fill="#f5f5f5"/>
  
  <!-- GPS Dispatch Vectors -->
  <line x1="250" y1="160" x2="400" y2="225" stroke="#444444" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="250" cy="160" r="14" fill="#202020" stroke="#777777" stroke-width="2"/>
  <path d="M 246 157 L 254 157 L 250 165 Z" fill="#f5f5f5"/>

  <line x1="550" y1="290" x2="400" y2="225" stroke="#444444" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="550" cy="290" r="14" fill="#202020" stroke="#777777" stroke-width="2"/>
  <circle cx="550" cy="290" r="4" fill="#f5f5f5"/>

  <!-- Badge Text -->
  <rect x="32" y="32" width="180" height="34" rx="17" fill="#181818" stroke="#333333" stroke-width="1"/>
  <text x="122" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">FLEET DISPATCH</text>

  <text x="400" y="390" font-family="'Inter', 'Cairo', sans-serif" font-size="20" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="-0.5">Waqt Al-Luzoom • وقت اللزوم</text>
  <text x="400" y="415" font-family="'Inter', 'Cairo', sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="middle">Emergency Heavy Vehicle Breakdown Service</text>
</svg>
