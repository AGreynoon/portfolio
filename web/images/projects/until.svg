<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad4)"/>

  <!-- Minimalist Monochromatic Countdown Display -->
  <g transform="translate(190, 110)">
    <!-- Time Units Blocks -->
    <g transform="translate(0, 0)">
      <rect width="90" height="110" rx="12" fill="#181818" stroke="#282828" stroke-width="1"/>
      <text x="45" y="72" font-family="'Inter', monospace" font-size="44" font-weight="700" fill="#f5f5f5" text-anchor="middle">14</text>
      <text x="45" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#737373" text-anchor="middle">DAYS</text>
    </g>

    <text x="105" y="70" font-family="'Inter', monospace" font-size="32" font-weight="700" fill="#444444" text-anchor="middle">:</text>

    <g transform="translate(120, 0)">
      <rect width="90" height="110" rx="12" fill="#181818" stroke="#282828" stroke-width="1"/>
      <text x="45" y="72" font-family="'Inter', monospace" font-size="44" font-weight="700" fill="#f5f5f5" text-anchor="middle">08</text>
      <text x="45" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#737373" text-anchor="middle">HOURS</text>
    </g>

    <text x="225" y="70" font-family="'Inter', monospace" font-size="32" font-weight="700" fill="#444444" text-anchor="middle">:</text>

    <g transform="translate(240, 0)">
      <rect width="90" height="110" rx="12" fill="#181818" stroke="#282828" stroke-width="1"/>
      <text x="45" y="72" font-family="'Inter', monospace" font-size="44" font-weight="700" fill="#f5f5f5" text-anchor="middle">42</text>
      <text x="45" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#737373" text-anchor="middle">MINUTES</text>
    </g>

    <text x="345" y="70" font-family="'Inter', monospace" font-size="32" font-weight="700" fill="#444444" text-anchor="middle">:</text>

    <g transform="translate(360, 0)">
      <rect width="60" height="110" rx="12" fill="#202020" stroke="#383838" stroke-width="1"/>
      <text x="30" y="72" font-family="'Inter', monospace" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">19</text>
      <text x="30" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#a3a3a3" text-anchor="middle">SEC</text>
    </g>
  </g>

  <!-- Badge Text -->
  <rect x="32" y="32" width="180" height="34" rx="17" fill="#181818" stroke="#333333" stroke-width="1"/>
  <text x="122" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">MINIMAL DESIGN</text>

  <text x="400" y="365" font-family="'Inter', 'Cairo', sans-serif" font-size="22" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="-0.5">Until. • حتى</text>
  <text x="400" y="392" font-family="'Inter', 'Cairo', sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="middle">Pure Monochromatic Milestone &amp; Event Countdown Tracker</text>
</svg>
