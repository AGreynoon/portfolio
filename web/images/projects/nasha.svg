<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  
  <!-- Book & OCR Target Visual -->
  <g transform="translate(260, 90)">
    <!-- Open Book Outline -->
    <path d="M 40 40 Q 140 30 140 220 Q 40 230 40 40 Z" fill="#181818" stroke="#333333" stroke-width="1.5"/>
    <path d="M 240 40 Q 140 30 140 220 Q 240 230 240 40 Z" fill="#1b1b1b" stroke="#333333" stroke-width="1.5"/>
    
    <!-- Text Lines on Page -->
    <line x1="55" y1="80" x2="125" y2="80" stroke="#383838" stroke-width="2"/>
    <line x1="55" y1="105" x2="125" y2="105" stroke="#383838" stroke-width="2"/>
    <line x1="55" y1="130" x2="115" y2="130" stroke="#383838" stroke-width="2"/>
    
    <!-- OCR Focus Bounding Box -->
    <rect x="155" y="70" x2="70" y2="35" width="70" height="40" rx="4" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="160" y1="85" x2="215" y2="85" stroke="#f5f5f5" stroke-width="2"/>
    <line x1="160" y1="100" x2="200" y2="100" stroke="#f5f5f5" stroke-width="2"/>

    <line x1="155" y1="130" x2="225" y2="130" stroke="#383838" stroke-width="2"/>
    <line x1="155" y1="155" x2="215" y2="155" stroke="#383838" stroke-width="2"/>

    <!-- Lens/Camera Reticle -->
    <circle cx="190" cy="90" r="32" fill="none" stroke="#666666" stroke-width="1"/>
    <line x1="190" y1="52" x2="190" y2="60" stroke="#888888" stroke-width="1.5"/>
    <line x1="190" y1="120" x2="190" y2="128" stroke="#888888" stroke-width="1.5"/>
    <line x1="152" y1="90" x2="160" y2="90" stroke="#888888" stroke-width="1.5"/>
    <line x1="220" y1="90" x2="228" y2="90" stroke="#888888" stroke-width="1.5"/>
  </g>

  <!-- Badge Text -->
  <rect x="32" y="32" width="180" height="34" rx="17" fill="#181818" stroke="#333333" stroke-width="1"/>
  <text x="122" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">ML ON-DEVICE OCR</text>

  <text x="400" y="380" font-family="'Inter', 'Cairo', sans-serif" font-size="20" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="-0.5">Nasha • نشأة</text>
  <text x="400" y="405" font-family="'Inter', 'Cairo', sans-serif" font-size="13" font-weight="400" fill="#737373" text-anchor="middle">Book Quote Extraction &amp; Categorization Utility</text>
</svg>
